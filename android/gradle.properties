# ---------------------------------------------------------------------------
# Java 25 / Gradle JDK note
# ---------------------------------------------------------------------------
# AGP is not yet validated against JDK 25 (open Flutter issue:
# flutter/flutter#187223). The fix that works: point Flutter at a JDK 21
# install instead of uninstalling anything. Confirmed working with the
# Eclipse Adoptium JDK 21 build - run once:
#
#   flutter config --jdk-dir="C:\Program Files\Eclipse Adoptium\jdk-21.0.12.101-hotspot"
#
# (adjust the folder name to whatever
#  Get-ChildItem "C:\Program Files\Eclipse Adoptium" -Directory
#  shows on your machine). No env vars to change, JDK 25 stays installed
# and untouched for everything else.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
